<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دردشة ومكالمات (تتبع)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.4.3/bcrypt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/idb-keyval@6/dist/umd.js"></script>
<style>
  /* (نفس التصميم السابق، لا تغيير) */
  :root { --bg: #1e1e2e; --bg-alt: #181825; --surface: #313244; --surface-hover: #45475a; --text: #cdd6f4; --text-muted: #a6adc8; --primary: #89b4fa; --primary-hover: #b4befe; --success: #a6e3a1; --danger: #f38ba8; --warning: #f9e2af; --border: #313244; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100dvh; overflow: hidden; }
  #authPage { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; padding: 20px; background: var(--bg); z-index: 1000; }
  #authPage h1 { color: var(--primary); font-size: 2rem; margin-bottom: 10px; }
  .tabs { display: flex; background: var(--bg-alt); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .tabs button { padding: 12px 30px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; transition: 0.3s; }
  .tabs button.active { background: var(--primary); color: var(--bg); font-weight: bold; }
  #authPage input { padding: 14px 16px; width: 100%; max-width: 320px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); outline: none; font-size: 1rem; transition: 0.3s; }
  #authPage input:focus { border-color: var(--primary); }
  #authPage .submit { padding: 14px 32px; width: 100%; max-width: 320px; background: var(--primary); color: var(--bg); border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s; }
  #authPage .submit:hover { background: var(--primary-hover); }
  #authPage .msg { font-size: 0.9rem; color: var(--danger); min-height: 22px; text-align: center; max-width: 320px; word-wrap: break-word; }
  #mainPage { display: none; height: 100dvh; width: 100%; overflow: hidden; }
  #layoutWrapper { display: flex; flex-direction: row; height: 100%; width: 100%; position: relative; }
  #sidebar { width: 320px; height: 100%; background: var(--bg-alt); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; z-index: 100; }
  .sidebar-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
  .sidebar-header .brand { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
  .sidebar-header .me { font-size: 0.85rem; color: var(--text-muted); }
  .sidebar-header .me b { color: var(--text); }
  .sidebar-header button { background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
  .sidebar-header button:hover { background: var(--surface); }
  #connectBox { padding: 15px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
  #connectBox .row { display: flex; gap: 8px; }
  #connectBox input { flex-grow: 1; padding: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 8px; outline: none; font-size: 0.9rem; }
  #connectBox button { padding: 10px 15px; background: var(--primary); color: var(--bg); border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
  #connectBox .btn-group { background: var(--success); color: var(--bg); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; text-align: center; border: none; }
  .section-title { padding: 12px 15px 6px; font-size: 0.75rem; color: var(--text-muted); font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
  .list-container { flex-grow: 1; overflow-y: auto; padding: 0 10px 10px; }
  .contact { padding: 12px; margin-bottom: 6px; background: var(--surface); border-radius: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; transition: 0.2s; }
  .contact:hover { background: var(--surface-hover); }
  .contact.active { background: var(--primary); color: var(--bg); }
  .contact.active .status { color: var(--bg) !important; }
  .contact .info { flex-grow: 1; min-width: 0; }
  .contact .name { font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
  .contact .status { font-size: 0.75rem; margin-top: 3px; color: var(--text-muted); }
  .contact .badge { background: var(--danger); color: var(--bg); font-size: 0.75rem; font-weight: bold; padding: 2px 8px; border-radius: 12px; min-width: 22px; text-align: center; }
  #chatArea { flex-grow: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; background: var(--bg); }
  #chatHeader { padding: 15px 20px; background: var(--bg-alt); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; min-height: 64px; }
  #chatHeader .header-left { display: flex; align-items: center; gap: 15px; }
  #menuBtn { display: none; background: none; border: none; color: var(--text); font-size: 1.5rem; cursor: pointer; }
  #chatHeader h2 { color: var(--primary); font-size: 1.1rem; }
  .call-btns { display: flex; gap: 10px; }
  .call-btns button { background: var(--surface); border: 1px solid var(--border); padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; transition: 0.2s; color: var(--text); }
  .call-btns button:hover { background: var(--surface-hover); color: var(--primary); }
  #welcome { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-muted); text-align: center; padding: 20px; }
  #welcome h1 { color: var(--primary); margin-bottom: 10px; font-size: 1.5rem; }
  #chatBox { display: none; flex-grow: 1; flex-direction: column; min-height: 0; }
  #messages { flex-grow: 1; overflow-y: auto; padding: 20px; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 80%; display: flex; flex-direction: column; }
  .msg.mine { align-self: flex-end; align-items: flex-end; }
  .msg.theirs { align-self: flex-start; align-items: flex-start; }
  .msg .bubble { padding: 12px 16px; border-radius: 18px; word-wrap: break-word; overflow: hidden; font-size: 0.95rem; line-height: 1.4; }
  .msg.mine .bubble { background: var(--primary); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.theirs .bubble { background: var(--surface); color: var(--text); border-bottom-left-radius: 4px; }
  .msg .bubble img, .msg .bubble video { max-width: 100%; border-radius: 12px; margin-top: 8px; display: block; }
  .msg .bubble a { color: inherit; text-decoration: underline; display: inline-block; margin-top: 5px; background: rgba(0,0,0,0.1); padding: 4px 8px; border-radius: 4px; }
  .msg .meta { font-size: 0.7rem; color: var(--text-muted); margin-top: 4px; padding: 0 5px; }
  #inputBox { display: flex; padding: 15px 20px; background: var(--bg-alt); border-top: 1px solid var(--border); gap: 10px; align-items: center; }
  #inputBox .attach { cursor: pointer; font-size: 1.5rem; color: var(--text-muted); padding: 0 5px; transition: 0.2s; }
  #inputBox .attach:hover { color: var(--primary); }
  #inputBox input[type="text"] { flex-grow: 1; padding: 12px 16px; border: none; border-radius: 12px; background: var(--surface); color: var(--text); outline: none; font-size: 1rem; }
  #inputBox button { padding: 12px 24px; background: var(--primary); color: var(--bg); border: none; border-radius: 12px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; }
  #inputBox button:hover { background: var(--primary-hover); }
  #callOverlay { display: none; position: fixed; inset: 0; background: rgba(10,10,15,0.95); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  #callOverlay h2 { color: white; margin-bottom: 20px; font-size: 1.2rem; text-align: center; }
  #videoContainer { position: relative; width: 100%; max-width: 900px; height: 50vh; background: #000; border-radius: 16px; overflow: hidden; display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
  #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
  #localVideo { position: absolute; bottom: 15px; right: 15px; width: 100px; height: 130px; background: #111; border-radius: 12px; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 10; }
  .call-controls { display: flex; gap: 20px; margin-top: 30px; }
  .call-controls button { width: 60px; height: 60px; border-radius: 50%; border: none; font-size: 1.5rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
  .btn-end { background: var(--danger); color: white; }
  .btn-end:hover { transform: scale(1.1); }
  .btn-mute { background: var(--warning); color: var(--bg); }
  .btn-mute:hover { transform: scale(1.1); }
  #incomingCallPopup { display: none; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--bg-alt); color: var(--text); padding: 20px; border-radius: 16px; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); align-items: center; gap: 20px; font-weight: bold; border: 1px solid var(--border); flex-direction: column; text-align: center; width: 90%; max-width: 350px; }
  .incoming-btns { display: flex; gap: 15px; width: 100%; justify-content: center; }
  #incomingCallPopup button { padding: 12px 24px; border-radius: 12px; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; flex: 1; }
  .btn-accept { background: var(--success); color: var(--bg); }
  .btn-reject { background: var(--danger); color: var(--bg); }
  @media (max-width: 768px) { #sidebar { position: absolute; top: 0; right: 0; height: 100%; width: 85%; max-width: 320px; margin-right: -100vw; transition: margin-right 0.3s ease-in-out; box-shadow: -5px 0 20px rgba(0,0,0,0.5); } #sidebar.open { margin-right: 0; } #menuBtn { display: block; } #chatHeader { padding: 12px 15px; } #inputBox { padding: 10px 15px; } #inputBox button { padding: 10px 18px; } #messages { padding: 15px; } #localVideo { width: 90px; height: 120px; } }
</style>
</head>
<body>
<!-- (واجهة المستخدم كما هي، لم تتغير) -->
<div id="authPage">
  <h1>💬 دردشة متطورة</h1>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">تسجيل دخول</button>
    <button id="tabSignup" onclick="switchTab('signup')">إنشاء حساب</button>
  </div>
  <input type="text" id="authUsername" placeholder="اسم المستخدم" maxlength="20">
  <input type="password" id="authPassword" placeholder="كلمة المرور" onkeypress="if(event.key==='Enter') submitAuth()">
  <button class="submit" id="authBtn" onclick="submitAuth()">دخول</button>
  <div class="msg" id="authMsg"></div>
</div>
<div id="mainPage">
  <div id="layoutWrapper">
    <div id="sidebar">
      <div class="sidebar-header">
        <div><div class="brand">💬 دردشة</div><div class="me">أنت: <b id="myNameDisplay"></b></div></div>
        <div style="display:flex; gap:5px;"><button onclick="logout()">خروج</button></div>
      </div>
      <div id="connectBox">
        <div class="row">
          <input id="connectInput" placeholder="اسم صديق..." onkeypress="if(event.key==='Enter') connect()">
          <button onclick="connect()">اتصال</button>
        </div>
        <button class="btn-group" onclick="createGroup()">➕ إنشاء مجموعة</button>
      </div>
      <div class="section-title">المجموعات</div>
      <div id="groupsList" class="list-container" style="max-height: 35%;"></div>
      <div class="section-title">الأصدقاء</div>
      <div id="contacts" class="list-container"></div>
    </div>
    <div id="chatArea">
      <div id="chatHeader">
        <div class="header-left"><button id="menuBtn" onclick="toggleSidebar()">☰</button><h2 id="chatTitle">اختر محادثة</h2></div>
        <div class="call-btns" id="callButtons" style="display:none;"><button onclick="startCall(false)" title="مكالمة صوتية">📞</button><button onclick="startCall(true)" title="مكالمة فيديو">📹</button></div>
      </div>
      <div id="welcome"><h1>مرحبًا 👋</h1><p>اختر صديقاً أو مجموعة لبدء الدردشة</p></div>
      <div id="chatBox">
        <div id="messages"></div>
        <div id="inputBox">
          <input type="file" id="fileInput" style="display:none" onchange="handleFileSelect(this)">
          <span class="attach" onclick="document.getElementById('fileInput').click()">📎</span>
          <input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') send()">
          <button onclick="send()">إرسال</button>
        </div>
      </div>
    </div>
  </div>
</div>
<div id="callOverlay">
  <h2 id="callStatus">جارٍ الاتصال...</h2>
  <div id="videoContainer"><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay playsinline muted></video></div>
  <div class="call-controls"><button class="btn-mute" id="muteBtn" onclick="toggleMute()">🎤</button><button class="btn-end" onclick="endCall()">❌</button></div>
</div>
<div id="incomingCallPopup">
  <span id="incomingText">📞 مكالمة واردة...</span>
  <div class="incoming-btns"><button class="btn-accept" onclick="acceptCall()">قبول</button><button class="btn-reject" onclick="rejectCall()">رفض</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://uongzuhnpngcrulvptuw.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_OIrvN5pAF8oCJkOEn4uucQ_DzuNQJQh';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let bcryptLib = typeof bcrypt !== 'undefined' ? bcrypt : (typeof dcodeIO !== 'undefined' ? dcodeIO.bcrypt : null);
// ... (المتغيرات العامة كما هي) ...
let currentUser = null, currentChatId = null, currentChatType = null, currentChatName = '', presenceChannel = null, globalChannel = null, onlineUsers = new Set(), authMode = 'login', renderedIds = new Set(), myGroups = [];

// ... (دوال UI و AUTH و MAIN و SIDEBAR و MESSAGES و FILES كما هي، لم تتغير) ...
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebarOnMobile() { if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open'); }
function switchTab(mode) { authMode = mode; document.getElementById('tabLogin').classList.toggle('active', mode === 'login'); document.getElementById('tabSignup').classList.toggle('active', mode === 'signup'); document.getElementById('authBtn').textContent = mode === 'login' ? 'دخول' : 'إنشاء حساب'; document.getElementById('authMsg').textContent = ''; }
async function submitAuth() { const username = document.getElementById('authUsername').value.trim(); const password = document.getElementById('authPassword').value; const msgEl = document.getElementById('authMsg'); msgEl.textContent = '...'; if (!username || password.length < 4) return msgEl.textContent = 'البيانات غير مكتملة'; if (!bcryptLib) return msgEl.textContent = 'خطأ في تحميل مكتبة التشفير'; try { if (authMode === 'signup') { const { data: exists } = await sb.from('site_users').select('id').eq('username', username).maybeSingle(); if (exists) return msgEl.textContent = 'الاسم محجوز'; const hash = bcryptLib.hashSync(password, bcryptLib.genSaltSync(10)); const { data, error } = await sb.from('site_users').insert({ username, password_hash: hash, role: 'user' }).select().single(); if (error) throw new Error(error.message); currentUser = { id: data.id, username: data.username }; localStorage.setItem('chat_user', JSON.stringify(currentUser)); enterMain(); } else { const { data: user } = await sb.from('site_users').select('*').eq('username', username).maybeSingle(); if (!user || !bcryptLib.compareSync(password, user.password_hash)) return msgEl.textContent = 'بيانات خاطئة'; currentUser = { id: user.id, username: user.username }; localStorage.setItem('chat_user', JSON.stringify(currentUser)); enterMain(); } } catch (err) { msgEl.textContent = err.message; } }
function logout() { localStorage.removeItem('chat_user'); location.reload(); }
async function enterMain() { document.getElementById('authPage').style.display = 'none'; document.getElementById('mainPage').style.display = 'block'; document.getElementById('myNameDisplay').textContent = currentUser.username; presenceChannel = sb.channel('presence-lobby', { config: { presence: { key: currentUser.id } } }); presenceChannel.on('presence', { event: 'sync' }, () => { onlineUsers = new Set(Object.keys(presenceChannel.presenceState())); refreshSidebar(); }); await presenceChannel.subscribe(async (status) => { if (status === 'SUBSCRIBED') await presenceChannel.track({ username: currentUser.username }); }); globalChannel = sb.channel('my-messages').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => handleIncoming(payload.new)).subscribe(); listenForIncomingCalls(); refreshSidebar(); processPendingFiles(); }
async function refreshSidebar() { const { data: members } = await sb.from('group_members').select('group_id').eq('user_id', currentUser.id); if (members && members.length > 0) { const groupIds = members.map(m => m.group_id); const { data: groups } = await sb.from('groups').select('*').in('id', groupIds); myGroups = groups || []; document.getElementById('groupsList').innerHTML = myGroups.map(g => `<div class="contact ${currentChatId === g.id ? 'active' : ''}" onclick="openChat('${g.id}', '${escapeAttr(g.name)}', 'group')"><div class="info"><div class="name">${escapeHtml(g.name)}</div></div></div>`).join(''); } else { document.getElementById('groupsList').innerHTML = '<div style="padding:10px; color:var(--text-muted); font-size:0.85rem;">لا توجد مجموعات</div>'; } const { data: msgs } = await sb.from('messages').select('sender_id, receiver_id').or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`); const peerIds = new Set(); (msgs || []).forEach(m => { if (m.sender_id !== currentUser.id) peerIds.add(m.sender_id); if (m.receiver_id && m.receiver_id !== currentUser.id) peerIds.add(m.receiver_id); }); onlineUsers.forEach(id => { if (id !== currentUser.id) peerIds.add(id); }); if (peerIds.size === 0) { document.getElementById('contacts').innerHTML = '<div style="padding:10px; color:var(--text-muted); font-size:0.85rem;">لا يوجد أصدقاء</div>'; return; } const { data: profiles } = await sb.from('site_users').select('id, username').in('id', Array.from(peerIds)); const { data: unread } = await sb.from('messages').select('sender_id').eq('receiver_id', currentUser.id).is('read_at', null); const unreadCount = {}; (unread || []).forEach(m => unreadCount[m.sender_id] = (unreadCount[m.sender_id] || 0) + 1); document.getElementById('contacts').innerHTML = (profiles || []).sort((a,b)=>a.username.localeCompare(b.username)).map(p => { const online = onlineUsers.has(p.id); const active = currentChatId === p.id ? 'active' : ''; const badge = unreadCount[p.id] ? `<span class="badge">${unreadCount[p.id]}</span>` : ''; return `<div class="contact ${active}" onclick="openChat('${p.id}', '${escapeAttr(p.username)}', 'dm')"><div class="info"><div class="name">${escapeHtml(p.username)}</div><div class="status" style="color:${online?'var(--success)':'var(--text-muted)'}">${online ? '● متصل' : '○ غير متصل'}</div></div>${badge}</div>`; }).join(''); }
async function createGroup() { const name = prompt("اسم المجموعة:"); if (!name) return; const membersStr = prompt("أسماء الأعضاء (مفصولة بفاصلة):"); if (!membersStr) return; const usernames = membersStr.split(',').map(s => s.trim()).filter(s => s); usernames.push(currentUser.username); const { data: users } = await sb.from('site_users').select('id, username').in('username', usernames); if (!users || users.length === 0) return alert("لم يتم العثور على الأعضاء"); const { data: group, error } = await sb.from('groups').insert({ name, created_by: currentUser.id }).select().single(); if (error) return alert("خطأ: " + error.message); const groupMembers = users.map(u => ({ group_id: group.id, user_id: u.id })); await sb.from('group_members').insert(groupMembers); alert("تم إنشاء المجموعة!"); refreshSidebar(); openChat(group.id, group.name, 'group'); }
async function connect() { const username = document.getElementById('connectInput').value.trim(); if (!username || username === currentUser.username) return; const { data: profile } = await sb.from('site_users').select('id, username').eq('username', username).maybeSingle(); if (!profile) return alert('المستخدم غير موجود'); document.getElementById('connectInput').value = ''; openChat(profile.id, profile.username, 'dm'); closeSidebarOnMobile(); }
async function openChat(id, name, type) { currentChatId = id; currentChatType = type; currentChatName = name; renderedIds.clear(); document.getElementById('welcome').style.display = 'none'; document.getElementById('chatBox').style.display = 'flex'; document.getElementById('chatTitle').textContent = name; document.getElementById('messages').innerHTML = ''; document.getElementById('callButtons').style.display = type === 'dm' ? 'flex' : 'none'; refreshSidebar(); closeSidebarOnMobile(); let query = sb.from('messages').select('*').order('created_at'); if (type === 'group') query = query.eq('group_id', id); else query = query.eq('room', makeRoom(currentUser.id, id)); const { data: msgs } = await query; for (const m of (msgs || [])) await renderMessage(m); if (type === 'dm') { await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('room', makeRoom(currentUser.id, id)).eq('receiver_id', currentUser.id).is('read_at', null); } refreshSidebar(); document.getElementById('msgInput').focus(); }
async function send() { const input = document.getElementById('msgInput'); const text = input.value.trim(); if (!text || !currentChatId) return; const msgData = { sender_id: currentUser.id, sender_name: currentUser.username, content: text }; if (currentChatType === 'group') { msgData.group_id = currentChatId; msgData.room = currentChatId; } else { msgData.receiver_id = currentChatId; msgData.room = makeRoom(currentUser.id, currentChatId); } const { data, error } = await sb.from('messages').insert(msgData).select().single(); if (error) return alert("فشل الإرسال: " + error.message); await renderMessage(data); input.value = ''; input.focus(); }
async function handleFileSelect(input) { const file = input.files[0]; if (!file || !currentChatId) return; if (file.size > 50 * 1024 * 1024) return alert("الحد الأقصى 50 ميجابايت"); input.value = ''; const originalName = file.name; const safeName = sanitizeFileName(originalName); const fileName = `${Date.now()}_${safeName}`; const filePath = `${currentChatType}/${currentChatId}/${fileName}`; const { error: uploadError } = await sb.storage.from('chat_files').upload(filePath, file); if (uploadError) return alert("فشل الرفع: " + uploadError.message); const { data: urlData } = sb.storage.from('chat_files').getPublicUrl(filePath); const fileUrl = urlData.publicUrl; await idbKeyval.set(fileName, file); const msgData = { sender_id: currentUser.id, sender_name: currentUser.username, content: '', file_url: fileUrl, file_type: file.type, file_name: fileName, file_original_name: originalName }; if (currentChatType === 'group') { msgData.group_id = currentChatId; msgData.room = currentChatId; } else { msgData.receiver_id = currentChatId; msgData.room = makeRoom(currentUser.id, currentChatId); } const { data, error } = await sb.from('messages').insert(msgData).select().single(); if (error) return alert("فشل حفظ الرسالة: " + error.message); await renderMessage(data); }
async function handleIncoming(m) { let isForMe = false; if (currentChatType === 'group' && m.group_id === currentChatId) isForMe = true; if (currentChatType === 'dm' && m.room === makeRoom(currentUser.id, currentChatId)) isForMe = true; if (isForMe) { await renderMessage(m); if (currentChatType === 'dm' && m.sender_id !== currentUser.id) { await sb.from('messages').update({ read_at: new Date().toISOString() }).eq('id', m.id); } } else { refreshSidebar(); } }
async function renderMessage(m) { if (renderedIds.has(m.id)) return; renderedIds.add(m.id); const isMine = m.sender_id === currentUser.id; const box = document.getElementById('messages'); const el = document.createElement('div'); el.className = 'msg ' + (isMine ? 'mine' : 'theirs'); let contentHtml = escapeHtml(m.content || ''); if (m.file_url && m.file_name) { let localBlob = await idbKeyval.get(m.file_name); if (localBlob) { const objectUrl = URL.createObjectURL(localBlob); contentHtml += renderMedia(objectUrl, m.file_type, m.file_name, m.file_original_name); } else { const displayName = m.file_original_name || 'ملف'; contentHtml += `<a href="${m.file_url}" target="_blank" download>⬇️ تحميل الملف (${displayName})</a>`; downloadAndSaveFile(m.file_url, m.file_name, m.file_type, m.file_original_name, el); } } el.innerHTML = `<div class="bubble">${contentHtml}</div><div class="meta">${escapeHtml(m.sender_name)}</div>`; box.appendChild(el); box.scrollTop = box.scrollHeight; }
function renderMedia(url, type, name, originalName) { const displayName = originalName || (name ? name.split('_').slice(1).join('_') : 'ملف'); if (type && type.startsWith('image/')) return `<img src="${url}" alt="${displayName}">`; if (type && type.startsWith('video/')) return `<video src="${url}" controls></video>`; return `<a href="${url}" target="_blank" download>📄 ${displayName}</a>`; }
function sanitizeFileName(name) { const lastDot = name.lastIndexOf('.'); let base = lastDot !== -1 ? name.substring(0, lastDot) : name; let ext = lastDot !== -1 ? name.substring(lastDot + 1) : ''; base = base.replace(/[^a-zA-Z0-9_-]/g, '_'); ext = ext.replace(/[^a-zA-Z0-9]/g, ''); if (!base) base = 'file'; return ext ? `${base}.${ext}` : base; }
async function processPendingFiles() { const { data: msgs } = await sb.from('messages').select('*').not('file_url', 'is', null); if (!msgs) return; for (const m of msgs) { const exists = await idbKeyval.get(m.file_name); if (!exists) await downloadAndSaveFile(m.file_url, m.file_name, m.file_type, m.file_original_name, null); } }
async function downloadAndSaveFile(url, fileName, fileType, originalName, el) { try { const response = await fetch(url); const blob = await response.blob(); await idbKeyval.set(fileName, blob); const filePath = url.split('/chat_files/')[1]; if (filePath) await sb.storage.from('chat_files').remove([decodeURIComponent(filePath)]); if (el) { const objectUrl = URL.createObjectURL(blob); const bubble = el.querySelector('.bubble'); const oldLink = bubble.querySelector('a'); if (oldLink) oldLink.remove(); bubble.innerHTML += renderMedia(objectUrl, fileType, fileName, originalName); } } catch (err) { console.error("فشل تحميل الملف: ", err); } }

// ================== WEBRTC CALLS (مع تتبع كامل) ==================
let pc = null;
let localStream = null;
let callChannel = null;
let incomingCallData = null;
let isCalling = false;
let isCaller = false;
let iceCandidatesQueue = [];
let makingOffer = false;
let ignoreOffer = false;
let polite = false;

const rtcConfig = { 
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'stun:stun1.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
  ] 
};

function listenForIncomingCalls() {
  sb.channel(`incoming_calls_${currentUser.id}`)
    .on('broadcast', { event: 'call_offer' }, ({ payload }) => {
      console.log('[CALL] Received call offer from:', payload.callerName);
      if (isCalling) {
        console.warn('[CALL] Already in a call, rejecting.');
        sb.channel(`incoming_calls_${payload.callerId}`).send({ type: 'broadcast', event: 'call_rejected', payload: {} });
        return;
      }
      incomingCallData = payload;
      document.getElementById('incomingText').textContent = `📞 مكالمة ${payload.isVideo ? 'فيديو' : 'صوتية'} واردة من ${payload.callerName}`;
      document.getElementById('incomingCallPopup').style.display = 'flex';
    })
    .on('broadcast', { event: 'call_rejected' }, () => {
      console.log('[CALL] Call was rejected by peer.');
      alert('تم رفض المكالمة.');
      endCall();
    })
    .subscribe((status) => {
      console.log('[CALL] Incoming calls channel status:', status);
    });
}

async function startCall(isVideo) {
  if (isCalling || !currentChatId || currentChatType !== 'dm') return;
  console.log('[CALL] Starting call. isVideo:', isVideo);
  isCalling = true;
  isCaller = true;
  polite = false;

  showCallUI(isVideo, 'جارٍ الاتصال...');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
    document.getElementById('localVideo').srcObject = localStream;
    console.log('[CALL] Local media acquired.');
  } catch (err) {
    console.error('[CALL] Failed to get local media:', err);
    alert('لا يمكن الوصول للكاميرا/الميكروفون: ' + err.message);
    endCall();
    return;
  }

  const roomId = makeRoom(currentUser.id, currentChatId);
  console.log('[CALL] Signaling Room ID:', roomId);
  setupPeerConnection(roomId);

  console.log('[CALL] Sending call offer notification...');
  sb.channel(`incoming_calls_${currentChatId}`).send({
    type: 'broadcast', event: 'call_offer',
    payload: { callerId: currentUser.id, callerName: currentUser.username, isVideo, roomId }
  });

  console.log('[CALL] Waiting 2 seconds before creating SDP offer...');
  setTimeout(async () => {
    if (!pc || !callChannel) {
        console.error('[CALL] Cannot create offer: peer connection or channel is missing.');
        return;
    }
    try {
      console.log('[CALL] Creating SDP offer...');
      makingOffer = true;
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      console.log('[CALL] Sending SDP offer via signaling channel...');
      callChannel.send({ type: 'broadcast', event: 'offer', payload: { offer } });
    } catch (err) {
      console.error('[CALL] Error creating/sending offer:', err);
    } finally {
      makingOffer = false;
    }
  }, 2000);
}

async function acceptCall() {
  document.getElementById('incomingCallPopup').style.display = 'none';
  if (!incomingCallData) return;
  console.log('[CALL] Accepting call from:', incomingCallData.callerName);

  isCalling = true;
  isCaller = false;
  polite = true;

  showCallUI(incomingCallData.isVideo, 'جارٍ الاتصال...');
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: incomingCallData.isVideo });
    document.getElementById('localVideo').srcObject = localStream;
    console.log('[CALL] Local media acquired.');
  } catch (err) {
    console.error('[CALL] Failed to get local media:', err);
    alert('لا يمكن الوصول للكاميرا: ' + err.message);
    rejectCall();
    return;
  }

  console.log('[CALL] Setting up peer connection for room:', incomingCallData.roomId);
  setupPeerConnection(incomingCallData.roomId);
  incomingCallData = null;
}

function setupPeerConnection(roomId) {
  if (pc) pc.close();
  pc = new RTCPeerConnection(rtcConfig);
  iceCandidatesQueue = [];
  console.log('[CALL] RTCPeerConnection created.');

  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

  pc.ontrack = (event) => {
    console.log('[CALL] Received remote track:', event.track.kind);
    document.getElementById('remoteVideo').srcObject = event.streams[0];
    document.getElementById('callStatus').textContent = 'متصل 🟢';
  };

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      console.log('[CALL] Sending ICE candidate:', event.candidate.candidate);
      if (callChannel) callChannel.send({ type: 'broadcast', event: 'ice-candidate', payload: { candidate: event.candidate } });
    }
  };

  pc.oniceconnectionstatechange = () => {
    console.log('[CALL] ICE Connection State:', pc.iceConnectionState);
    if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') {
      document.getElementById('callStatus').textContent = 'متصل 🟢';
    } else if (pc.iceConnectionState === 'failed' || pc.iceConnectionState === 'disconnected') {
      document.getElementById('callStatus').textContent = 'انقطع الاتصال 🔴';
    }
  };

  callChannel = sb.channel(`call:${roomId}`, { config: { broadcast: { self: false } } });
  console.log('[CALL] Subscribing to signaling channel:', `call:${roomId}`);

  callChannel
    .on('broadcast', { event: 'offer' }, async ({ payload }) => {
      console.log('[CALL] Received SDP offer.');
      const offerCollision = makingOffer || pc.signalingState !== 'stable';
      ignoreOffer = !polite && offerCollision;
      if (ignoreOffer) {
        console.warn('[CALL] Offer collision, ignoring as impolite peer.');
        return;
      }
      console.log('[CALL] Setting remote description (offer)...');
      await pc.setRemoteDescription(new RTCSessionDescription(payload.offer));
      processIceQueue();
      console.log('[CALL] Creating SDP answer...');
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      console.log('[CALL] Sending SDP answer...');
      callChannel.send({ type: 'broadcast', event: 'answer', payload: { answer } });
    })
    .on('broadcast', { event: 'answer' }, async ({ payload }) => {
      console.log('[CALL] Received SDP answer.');
      await pc.setRemoteDescription(new RTCSessionDescription(payload.answer));
      processIceQueue();
    })
    .on('broadcast', { event: 'ice-candidate' }, async ({ payload }) => {
      console.log('[CALL] Received ICE candidate.');
      if (payload.candidate) {
        if (pc.remoteDescription) {
          try { await pc.addIceCandidate(new RTCIceCandidate(payload.candidate)); } catch (e) { console.error('[CALL] Error adding ICE candidate:', e); }
        } else {
          console.log('[CALL] Queuing ICE candidate.');
          iceCandidatesQueue.push(payload.candidate);
        }
      }
    })
    .on('broadcast', { event: 'reject' }, () => {
      console.log('[CALL] Received rejection from peer.');
      alert('تم رفض المكالمة.');
      endCall();
    })
    .subscribe((status) => {
      console.log('[CALL] Signaling channel status:', status);
      if (status === 'SUBSCRIBED' && !isCaller) {
        console.log('[CALL] (Acceptor) Sending "ready" signal to caller.');
        callChannel.send({ type: 'broadcast', event: 'ready' });
      }
    });
}

function processIceQueue() {
  console.log(`[CALL] Processing ${iceCandidatesQueue.length} queued ICE candidates.`);
  iceCandidatesQueue.forEach(async (candidate) => {
    try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch(e){ console.error('[CALL] Error processing queued candidate:', e); }
  });
  iceCandidatesQueue = [];
}

function rejectCall() {
  if (incomingCallData) {
    console.log('[CALL] Rejecting call.');
    sb.channel(`incoming_calls_${incomingCallData.callerId}`).send({ type: 'broadcast', event: 'call_rejected', payload: {} });
    incomingCallData = null;
  }
  document.getElementById('incomingCallPopup').style.display = 'none';
}

function toggleMute() { if (localStream) { const audioTrack = localStream.getAudioTracks()[0]; if (audioTrack) { audioTrack.enabled = !audioTrack.enabled; document.getElementById('muteBtn').textContent = audioTrack.enabled ? '🎤' : '🔇'; } } }

function endCall() {
  console.log('[CALL] Ending call.');
  if (callChannel) { if (isCaller) callChannel.send({ type: 'broadcast', event: 'reject', payload: {} }); sb.removeChannel(callChannel); callChannel = null; }
  if (pc) { pc.close(); pc = null; }
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  isCalling = false; isCaller = false; iceCandidatesQueue = []; makingOffer = false; ignoreOffer = false;
  document.getElementById('callOverlay').style.display = 'none';
  document.getElementById('remoteVideo').srcObject = null;
  document.getElementById('localVideo').srcObject = null;
  document.getElementById('muteBtn').textContent = '🎤';
}

function showCallUI(isVideo, statusText) { document.getElementById('callOverlay').style.display = 'flex'; document.getElementById('callStatus').textContent = statusText; document.getElementById('localVideo').style.display = isVideo ? 'block' : 'none'; }

// ... (دوال HELPERS و BOOT كما هي) ...
function makeRoom(a, b) { return [a, b].sort().join('__'); }
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }
(function boot() { const saved = localStorage.getItem('chat_user'); if (saved) { try { currentUser = JSON.parse(saved); if (currentUser && currentUser.id) enterMain(); } catch(e) { localStorage.removeItem('chat_user'); } } })();
</script>
